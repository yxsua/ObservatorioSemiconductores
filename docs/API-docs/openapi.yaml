  /media/{id}:
    get:
      tags: [Media]
      summary: Entrega una imagen raster pública
      operationId: getPublicMediaInline
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Binario de imagen local
          headers:
            Cache-Control: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            image/avif: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "302":
          description: Redirección a almacenamiento HTTP(S)
          headers:
            Location: { schema: { type: string, format: uri } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/PermissionError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /media/{id}/download:
    get:
      tags: [Media]
      summary: Descarga un medio público con una cuenta registrada
      operationId: downloadPublicMedia
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Archivo local como attachment
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "302":
          description: Redirección autenticada a almacenamiento HTTP(S)
          headers:
            Location: { schema: { type: string, format: uri } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/PermissionError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /exports/{resource}.{format}:
    get:
      tags: [Exports]
      summary: Exporta una colección pública con una cuenta registrada
      description: >-
        Aplica los filtros públicos del recurso y genera como máximo el
        límite configurado de registros. No admite page, pageSize ni status.
        Cada descarga exitosa queda registrada en el historial del usuario.
      operationId: exportPublicCollection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [signals, trends, alerts, content]
        - name: format
          in: path
          required: true
          schema: { type: string, enum: [csv, json] }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/Fcv"
        - $ref: "#/components/parameters/Impact"
        - $ref: "#/components/parameters/Urgency"
        - $ref: "#/components/parameters/Reliability"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - name: type
          in: query
          schema: { type: string, maxLength: 50 }
        - name: direction
          in: query
          schema: { type: string }
        - name: maturity
          in: query
          schema: { type: string }
        - name: level
          in: query
          schema: { type: string }
        - name: audience
          in: query
          schema: { type: string }
        - name: sort
          in: query
          description: Debe corresponder a un campo público permitido por el recurso.
          schema: { type: string }
      responses:
        "200":
          description: Archivo generado
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            X-Export-Id: { schema: { type: integer, format: int64 } }
            X-Row-Count: { schema: { type: integer, minimum: 0 } }
            X-Checksum-SHA256:
              schema: { type: string, pattern: "^[a-f0-9]{64}$" }
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: "#/components/schemas/ExportJsonDocument" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/PermissionError" }
        "422": { $ref: "#/components/responses/DomainRuleError" }
  /exports/history:
    get:
      tags: [Exports]
