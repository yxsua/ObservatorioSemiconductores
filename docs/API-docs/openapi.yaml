openapi: 3.1.0
info:
  title: API del Observatorio de Semiconductores
  version: 0.5.7
  description: >-
    Contrato de autenticación, catálogos y las verticales de señales,
    tendencias, alertas y las APIs editorial interna y pública, incluida la
    resolución de bloques, entrega de medios y exportaciones autenticadas,
    implementadas hasta la Fase 5.6.
servers:
  - url: /api
tags:
  - name: Health
  - name: Auth
  - name: Catalogs
  - name: Admin Sources
  - name: Signals
  - name: Admin Signals
  - name: Trends
  - name: Admin Trends
  - name: Alerts
  - name: Admin Alerts
  - name: Admin Editorial
  - name: Public Content
  - name: Media
  - name: Exports
paths:
  /health:
    get:
      tags: [Health]
      summary: Comprueba backend y conexión con PostgreSQL
      operationId: getHealth
      responses:
        "200":
          description: Servicios disponibles
          content:
            application/json:
              schema:
                type: object
                required: [status, backend, database, timestamp]
                properties:
                  status: { type: string, const: ok }
                  backend: { type: string, const: running }
                  database: { type: string, const: connected }
                  timestamp: { type: string, format: date-time }
        "500":
          description: PostgreSQL no está disponible
  /auth/register:
    post:
      tags: [Auth]
      summary: Registra una cuenta pública con rol MEMBER
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /auth/me:
    get:
      tags: [Auth]
      summary: Obtiene el perfil autenticado, roles y permisos
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil obtenido
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
  /catalogs:
    get:
      tags: [Catalogs]
      summary: Enumera los catálogos disponibles
      operationId: listCatalogs
      responses:
        "200":
          description: Nombres de catálogo
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    type: array
                    items: { type: string }
  /catalogs/{catalog}:
    get:
      tags: [Catalogs]
      summary: Obtiene los elementos de un catálogo
      operationId: getCatalog
      parameters:
        - name: catalog
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CatalogName"
      responses:
        "200":
          description: Catálogo obtenido
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    type: object
                    required: [name, items]
                    properties:
                      name: { $ref: "#/components/schemas/CatalogName" }
                      items:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFoundError"
  /signals:
    get:
      tags: [Signals]
      summary: Lista exclusivamente señales validadas
      operationId: listPublicSignals
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/Fcv"
        - $ref: "#/components/parameters/Impact"
        - $ref: "#/components/parameters/Urgency"
        - $ref: "#/components/parameters/Reliability"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/SignalSort"
      responses:
        "200":
          description: Señales públicas paginadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSignalsResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
  /signals/{id}:
    get:
      tags: [Signals]
      summary: Obtiene una señal validada
      operationId: getPublicSignal
      parameters:
        - $ref: "#/components/parameters/SignalId"
      responses:
        "200":
          description: Señal pública
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalResponse" }
        "404":
          $ref: "#/components/responses/NotFoundError"
  /admin/signals:
    get:
      tags: [Admin Signals]
      summary: Lista señales internas
      operationId: listInternalSignals
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SignalStatusCode" }
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/Fcv"
        - $ref: "#/components/parameters/Impact"
        - $ref: "#/components/parameters/Urgency"
        - $ref: "#/components/parameters/Reliability"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/SignalSort"
      responses:
        "200":
          description: Señales internas paginadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSignalsResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
    post:
      tags: [Admin Signals]
      summary: Crea una señal NEW para el analista autenticado
      operationId: createSignal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSignalInput" }
      responses:
        "201":
          description: Señal creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
        "422":
          $ref: "#/components/responses/DomainRuleError"
  /admin/signals/{id}:
    get:
      tags: [Admin Signals]
      summary: Obtiene una señal con campos internos
      operationId: getInternalSignal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SignalId"
      responses:
        "200":
          description: Señal interna
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalResponse" }
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Admin Signals]
      summary: Modifica una señal en estado NEW
      operationId: updateSignal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SignalId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSignalInput" }
      responses:
        "200":
          description: Señal actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalResponse" }
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/DomainRuleError"
  /admin/signals/{id}/transitions:
    post:
      tags: [Admin Signals]
      summary: Ejecuta una transición semántica de estado
      operationId: transitionSignal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SignalId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalTransitionInput" }
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalResponse" }
        "403":
          $ref: "#/components/responses/PermissionError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/DomainRuleError"
  /admin/signals/{id}/history:
    get:
      tags: [Admin Signals]
      summary: Obtiene el historial de estados de una señal
      operationId: getSignalHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SignalId"
      responses:
        "200":
          description: Historial cronológico
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SignalHistoryEntry" }
  /admin/sources:
    get:
      tags: [Admin Sources]
      summary: Lista fuentes; por defecto sólo las activas
      operationId: listSources
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: active
          in: query
          schema: { type: string, enum: ["true", "false", all], default: "true" }
      responses:
        "200":
          description: Fuentes activas
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/PermissionError"
    post:
      tags: [Admin Sources]
      summary: Registra una fuente
      operationId: createSource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSourceInput" }
      responses:
        "201": { description: Fuente creada, content: { application/json: { schema: { $ref: "#/components/schemas/SourceResponse" } } } }
  /admin/sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [Admin Sources]
      summary: Obtiene una fuente interna
      operationId: getSource
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Fuente, content: { application/json: { schema: { $ref: "#/components/schemas/SourceResponse" } } } }
    patch:
      tags: [Admin Sources]
      summary: Actualiza una fuente activa con control de versión
      operationId: updateSource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSourceInput" }
      responses:
        "200": { description: Fuente actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/SourceResponse" } } } }
        "409": { $ref: "#/components/responses/ConflictError" }
  /admin/sources/{id}/deactivate:
    post:
      tags: [Admin Sources]
      summary: Desactiva una fuente conservando sus relaciones históricas
      operationId: deactivateSource
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updatedAt]
              properties:
                updatedAt: { type: string, format: date-time }
      responses:
        "200": { description: Fuente desactivada, content: { application/json: { schema: { $ref: "#/components/schemas/SourceResponse" } } } }
        "409": { $ref: "#/components/responses/ConflictError" }
  /trends:
    get:
      tags: [Trends]
      summary: Lista tendencias activas
      operationId: listPublicTrends
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: direction
          in: query
          schema: { type: string }
        - name: maturity
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/TrendSort"
      responses:
        "200":
          description: Tendencias públicas paginadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedTrendsResponse" }
  /trends/{id}:
    get:
      tags: [Trends]
      summary: Obtiene una tendencia activa
      operationId: getPublicTrend
      parameters:
        - $ref: "#/components/parameters/TrendId"
      responses:
        "200":
          description: Tendencia pública
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendResponse" }
        "404":
          $ref: "#/components/responses/NotFoundError"
  /admin/trends:
    get:
      tags: [Admin Trends]
      summary: Lista tendencias internas
      operationId: listInternalTrends
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string }
        - name: maturity
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/TrendSort"
      responses:
        "200":
          description: Tendencias internas paginadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedTrendsResponse" }
        "403": { $ref: "#/components/responses/PermissionError" }
    post:
      tags: [Admin Trends]
      summary: Crea una tendencia NEW
      operationId: createTrend
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTrendInput" }
      responses:
        "201":
          description: Tendencia creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendResponse" }
        "422": { $ref: "#/components/responses/DomainRuleError" }
  /admin/trends/{id}:
    get:
      tags: [Admin Trends]
      summary: Obtiene una tendencia interna
      operationId: getInternalTrend
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/TrendId" }]
      responses:
        "200":
          description: Tendencia interna
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendResponse" }
    patch:
      tags: [Admin Trends]
      summary: Modifica una tendencia NEW
      operationId: updateTrend
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/TrendId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTrendInput" }
      responses:
        "200":
          description: Tendencia actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendResponse" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/DomainRuleError" }
  /admin/trends/{id}/transitions:
    post:
      tags: [Admin Trends]
      summary: Ejecuta una transición de tendencia
      operationId: transitionTrend
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/TrendId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrendTransitionInput" }
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendResponse" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/DomainRuleError" }
  /admin/trends/{id}/history:
    get:
      tags: [Admin Trends]
      summary: Obtiene el historial de una tendencia
      operationId: getTrendHistory
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/TrendId" }]
      responses:
        "200":
          description: Historial cronológico
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SignalHistoryEntry" }
  /admin/trends/{id}/signals:
    post:
      tags: [Admin Trends]
      summary: Vincula señales a una tendencia NEW
      operationId: linkTrendSignals
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/TrendId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelationIdsInput" }
      responses:
        "200":
          description: Señales vinculadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendResponse" }
  /admin/trends/{id}/signals/{signalId}:
    delete:
      tags: [Admin Trends]
      summary: Desvincula una señal de una tendencia NEW
      operationId: unlinkTrendSignal
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TrendId"
        - $ref: "#/components/parameters/RelatedSignalId"
      responses:
        "200":
          description: Señal desvinculada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendResponse" }
  /admin/trends/{id}/actors:
    post:
      tags: [Admin Trends]
      summary: Vincula actores a una tendencia NEW
      operationId: linkTrendActors
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/TrendId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelationIdsInput" }
      responses:
        "200":
          description: Actores vinculados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendResponse" }
  /admin/trends/{id}/actors/{actorId}:
    delete:
      tags: [Admin Trends]
      summary: Desvincula un actor de una tendencia NEW
      operationId: unlinkTrendActor
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TrendId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: Actor desvinculado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendResponse" }
  /admin/actors:
    get:
      tags: [Admin Trends]
      summary: Lista actores disponibles para tendencias
      operationId: listActors
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Search" }]
      responses:
        "200":
          description: Actores disponibles
  /alerts:
    get:
      tags: [Alerts]
      summary: Lista alertas publicadas o cerradas
      operationId: listPublicAlerts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/AlertStatus"
        - $ref: "#/components/parameters/AlertLevel"
        - $ref: "#/components/parameters/AlertAudience"
        - $ref: "#/components/parameters/AlertSort"
      responses:
        "200":
          description: Alertas públicas paginadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedAlertsResponse" }
  /alerts/{id}:
    get:
      tags: [Alerts]
      summary: Obtiene una alerta publicada o cerrada
      operationId: getPublicAlert
      parameters: [{ $ref: "#/components/parameters/AlertId" }]
      responses:
        "200":
          description: Alerta pública
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertResponse" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /admin/alerts:
    get:
      tags: [Admin Alerts]
      summary: Lista alertas con información interna
      operationId: listInternalAlerts
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/AlertStatus"
        - $ref: "#/components/parameters/AlertLevel"
        - $ref: "#/components/parameters/AlertAudience"
        - $ref: "#/components/parameters/AlertSort"
      responses:
        "200":
          description: Alertas internas paginadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedAlertsResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/PermissionError" }
    post:
      tags: [Admin Alerts]
      summary: Crea una alerta manual en NEW
      operationId: createAlert
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAlertInput" }
      responses:
        "201":
          description: Alerta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/PermissionError" }
        "422": { $ref: "#/components/responses/DomainRuleError" }
  /admin/alerts/{id}:
    get:
      tags: [Admin Alerts]
      summary: Obtiene una alerta con información interna
      operationId: getInternalAlert
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AlertId" }]
      responses:
        "200":
          description: Alerta interna
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertResponse" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    patch:
      tags: [Admin Alerts]
      summary: Actualiza una alerta NEW
      operationId: updateAlert
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AlertId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAlertInput" }
      responses:
        "200":
          description: Alerta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertResponse" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/DomainRuleError" }
  /admin/alerts/{id}/transitions:
    post:
      tags: [Admin Alerts]
      summary: Ejecuta una transición semántica de alerta
      operationId: transitionAlert
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AlertId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertTransitionInput" }
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertResponse" }
