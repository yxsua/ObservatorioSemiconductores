        activationRule: { type: [string, "null"], maxLength: 5000 }
        notes: { type: [string, "null"], maxLength: 5000 }
        updatedAt: { type: string, format: date-time }
    AudienceCodesInput:
      type: object
      additionalProperties: false
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 40 }
    AlertTransitionInput:
      type: object
      additionalProperties: false
      required: [transition]
      properties:
        transition:
          type: string
          enum:
            - SUBMIT_FOR_REVIEW
            - REQUEST_CHANGES
            - VALIDATE
            - REOPEN
            - PUBLISH
            - CLOSE
        notes: { type: [string, "null"], maxLength: 2000 }
    AlertHistoryEntry:
      type: object
      required: [id, toStatus, transition, changedBy, changedAt]
      properties:
        id: { type: integer, format: int64 }
        fromStatus:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CatalogValue"
        toStatus: { $ref: "#/components/schemas/CatalogValue" }
        transition: { type: string }
        changedBy:
          type: object
          required: [id, name]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
        notes: { type: [string, "null"] }
        changedAt: { type: string, format: date-time }
    EditorialBlockType:
      type: object
      required:
        - id
        - code
        - name
        - category
        - schemaVersion
        - dataContract
        - settingsContract
        - supportsChildren
        - publicAllowed
      properties:
        id: { type: integer, minimum: 1 }
        code:
          type: string
          enum:
            - heading
            - paragraph
            - quote
            - list
            - callout
            - divider
            - image
            - file
            - table
            - chart
            - signal
            - trend
            - alert
        name: { type: string }
        category:
          type: string
          enum: [text, layout, media, data, surveillance]
        schemaVersion: { type: integer, const: 1 }
        icon: { type: [string, "null"] }
        description: { type: [string, "null"] }
        supportsChildren: { type: boolean }
        publicAllowed: { type: boolean }
        dataContract:
          type: object
          additionalProperties: true
        settingsContract:
          type: object
          additionalProperties: true
    EditorialBlockInput:
      type: object
      additionalProperties: false
      required: [type, schemaVersion, data]
      properties:
        type: { type: string }
        schemaVersion: { type: integer, minimum: 1 }
        data: { type: object }
        settings: { type: object }
        position: { type: integer, minimum: 1 }
        isVisible: { type: boolean, default: true }
        cssClass: { type: [string, "null"], maxLength: 100 }
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: {}
    EditorialPerson:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
    EditorialStatus:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    PublicCategory:
      type: object
      required: [id, name, fcv]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        fcv: { $ref: "#/components/schemas/EditorialStatus" }
    PublicContentSummary:
      type: object
      required: [id, slug, type, title, categories, publishedAt]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        slug: { type: string }
        type: { $ref: "#/components/schemas/EditorialStatus" }
        title: { type: string }
        summary: { type: [string, "null"] }
        featuredMedia:
          oneOf:
            - type: "null"
            - type: object
              required: [id, filename, mimeType]
              properties:
                id: { type: integer, format: int64, minimum: 1 }
                filename: { type: string }
                mimeType: { type: [string, "null"] }
        categories:
          type: array
          items: { $ref: "#/components/schemas/PublicCategory" }
        publishedAt: { type: string, format: date-time }
    ResolvedMediaBlock:
      type: object
      required:
        - kind
        - id
        - filename
        - originalFilename
        - mimeType
        - extension
        - sizeBytes
        - url
        - downloadUrl
      properties:
        kind: { type: string, enum: [image, file] }
        id: { type: integer, format: int64, minimum: 1 }
        filename: { type: string }
        originalFilename: { type: [string, "null"] }
        mimeType: { type: [string, "null"] }
        extension: { type: [string, "null"] }
        sizeBytes: { type: [integer, "null"], format: int64, minimum: 0 }
        url: { type: [string, "null"] }
        downloadUrl: { type: string }
    ResolvedEntityBlock:
      type: object
      required: [kind, id, businessCode, title, href]
      properties:
        kind: { type: string, enum: [signal, trend, alert] }
        id: { type: integer, format: int64, minimum: 1 }
        businessCode: { type: string }
        title: { type: string }
        href: { type: string }
        summary: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        relations: { type: object, additionalProperties: true }
    ResolvedBlock:
      oneOf:
        - $ref: "#/components/schemas/ResolvedMediaBlock"
        - $ref: "#/components/schemas/ResolvedEntityBlock"
    PublicBlock:
      type: object
      required: [id, type, schemaVersion, position, data, settings]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        type: { $ref: "#/components/schemas/EditorialStatus" }
        schemaVersion: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 1 }
        data: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
        cssClass: { type: [string, "null"] }
        resolved: { $ref: "#/components/schemas/ResolvedBlock" }
    PublicSection:
      type: object
      required: [id, title, position, isCollapsible, settings, blocks]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        type:
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EditorialStatus" }]
        title: { type: [string, "null"] }
        position: { type: integer, minimum: 1 }
        isCollapsible: { type: boolean }
        settings: { type: object, additionalProperties: true }
        blocks:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PublicBlock" }
    PublicRelatedEntity:
      type: object
      required: [id, businessCode, title]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        businessCode: { type: string }
        title: { type: string }
    PublicRelations:
      type: object
      required: [categories, signals, trends, alerts]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/PublicCategory" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/PublicRelatedEntity" }
        trends:
          type: array
          items: { $ref: "#/components/schemas/PublicRelatedEntity" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/PublicRelatedEntity" }
    PublicContent:
      allOf:
        - $ref: "#/components/schemas/PublicContentSummary"
        - type: object
          required: [versionNumber, sections, relations]
          properties:
            versionNumber: { type: integer, minimum: 1 }
            sections:
              type: array
              items: { $ref: "#/components/schemas/PublicSection" }
            relations: { $ref: "#/components/schemas/PublicRelations" }
    PublicContentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PublicContent" }
    PaginatedPublicContentResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/PublicContentSummary" }
            pagination: { $ref: "#/components/schemas/Pagination" }
    ExportJsonDocument:
      type: object
      required: [generatedAt, resource, rowCount, filters, data]
      properties:
        generatedAt: { type: string, format: date-time }
        resource:
          type: string
          enum: [signals, trends, alerts, content]
        rowCount: { type: integer, minimum: 0 }
        filters:
          type: object
          additionalProperties: { type: string }
        data:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/Signal"
              - $ref: "#/components/schemas/Trend"
              - $ref: "#/components/schemas/Alert"
              - $ref: "#/components/schemas/PublicContentSummary"
    ExportHistoryEntry:
      type: object
      required:
        - id
        - resource
        - format
        - filters
        - rowCount
        - sizeBytes
        - checksum
        - createdAt
      properties:
        id: { type: integer, format: int64 }
        resource:
          type: string
          enum: [signals, trends, alerts, content]
        format: { type: string, enum: [csv, json] }
        filters:
          type: object
          additionalProperties: { type: string }
        rowCount: { type: integer, minimum: 0 }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        checksum: { type: string, pattern: "^[a-f0-9]{64}$" }
        createdAt: { type: string, format: date-time }
    PaginatedExportHistoryResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ExportHistoryEntry" }
            pagination: { $ref: "#/components/schemas/Pagination" }
    InternalContent:
      type: object
      required:
        - id
        - type
        - status
        - title
        - author
        - currentVersionId
        - publishedVersionId
        - metrics
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, format: int64 }
        slug: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/EditorialStatus" }
        status: { $ref: "#/components/schemas/EditorialStatus" }
        title: { type: string }
        summary: { type: [string, "null"] }
        featuredMedia:
          oneOf:
            - type: "null"
            - type: object
              required: [id, filename, mimeType]
              properties:
                id: { type: integer, format: int64 }
                filename: { type: string }
                mimeType: { type: string }
        author: { $ref: "#/components/schemas/EditorialPerson" }
        currentVersionId: { type: [integer, "null"], format: int64 }
        publishedVersionId: { type: [integer, "null"], format: int64 }
        currentVersionNumber: { type: [integer, "null"] }
        approval: { $ref: "#/components/schemas/EditorialAction" }
        publication: { $ref: "#/components/schemas/EditorialAction" }
        archive: { $ref: "#/components/schemas/EditorialAction" }
        metrics:
          type: object
          required: [versionCount, sectionCount, blockCount]
          properties:
            versionCount: { type: integer, minimum: 0 }
            sectionCount: { type: integer, minimum: 0 }
            blockCount: { type: integer, minimum: 0 }
        currentVersion: { $ref: "#/components/schemas/ContentVersion" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EditorialAction:
      oneOf:
        - type: "null"
        - type: object
          required: [by, at]
          properties:
            by: { $ref: "#/components/schemas/EditorialPerson" }
            at: { type: string, format: date-time }
    ContentVersionSummary:
      type: object
      required: [id, number, title, createdBy, createdAt, isCurrent, isPublished, metrics]
      properties:
        id: { type: integer, format: int64 }
        number: { type: integer, minimum: 1 }
        title: { type: string }
        summary: { type: [string, "null"] }
        changeSummary: { type: [string, "null"] }
        createdBy: { $ref: "#/components/schemas/EditorialPerson" }
        createdAt: { type: string, format: date-time }
        approvedBy:
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EditorialPerson" }]
        approvedAt: { type: [string, "null"], format: date-time }
        publishedBy:
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EditorialPerson" }]
        publishedAt: { type: [string, "null"], format: date-time }
        isCurrent: { type: boolean }
        isPublished: { type: boolean }
        metrics:
          type: object
          required: [sectionCount, blockCount]
          properties:
            sectionCount: { type: integer, minimum: 0 }
            blockCount: { type: integer, minimum: 0 }
    EditorialBlock:
      type: object
      required: [id, type, schemaVersion, position, data, settings, isVisible, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/EditorialStatus" }
        schemaVersion: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 1 }
        data: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
        resolved: { $ref: "#/components/schemas/ResolvedBlock" }
        isVisible: { type: boolean }
        cssClass: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EditorialSection:
      type: object
      required: [id, title, position, isCollapsible, isVisible, settings, blocks]
      properties:
        id: { type: integer, format: int64 }
        type:
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EditorialStatus" }]
        title: { type: [string, "null"] }
        position: { type: integer, minimum: 1 }
        isCollapsible: { type: boolean }
        isVisible: { type: boolean }
        settings: { type: object, additionalProperties: true }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/EditorialBlock" }
    RelatedEditorialEntity:
      type: object
      required: [id, businessCode, title, status]
      properties:
        id: { type: integer, format: int64 }
        businessCode: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/EditorialStatus" }
    ContentVersion:
      type: object
      required:
        - id
        - number
        - title
        - createdBy
        - createdAt
        - isCurrent
        - isPublished
        - featuredMediaId
        - sections
        - relations
      properties:
        id: { type: integer, format: int64 }
        number: { type: integer, minimum: 1 }
        title: { type: string }
        summary: { type: [string, "null"] }
        featuredMediaId: { type: [integer, "null"], format: int64 }
        changeSummary: { type: [string, "null"] }
        createdBy: { $ref: "#/components/schemas/EditorialPerson" }
        createdAt: { type: string, format: date-time }
        approvedBy:
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EditorialPerson" }]
        approvedAt: { type: [string, "null"], format: date-time }
        publishedBy:
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EditorialPerson" }]
        publishedAt: { type: [string, "null"], format: date-time }
        isCurrent: { type: boolean }
        isPublished: { type: boolean }
        sections:
          type: array
          items: { $ref: "#/components/schemas/EditorialSection" }
        relations:
          type: object
          required: [categories, signals, trends, alerts]
          properties:
            categories:
              type: array
              items: { type: object, additionalProperties: true }
            signals:
              type: array
              items: { $ref: "#/components/schemas/RelatedEditorialEntity" }
            trends:
              type: array
              items: { $ref: "#/components/schemas/RelatedEditorialEntity" }
            alerts:
              type: array
              items: { $ref: "#/components/schemas/RelatedEditorialEntity" }
    CreateContentInput:
      type: object
      additionalProperties: false
      required: [typeCode, title]
      properties:
        typeCode: { type: string, minLength: 1, maxLength: 50 }
        title: { type: string, minLength: 1, maxLength: 250 }
        summary: { type: [string, "null"], maxLength: 10000 }
        slug:
          type: [string, "null"]
          maxLength: 250
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        featuredMediaId: { type: [integer, "null"], format: int64, minimum: 1 }
        templateId: { type: [integer, "null"], format: int64, minimum: 1 }
    UpdateContentInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        typeCode: { type: string, minLength: 1, maxLength: 50 }
        title: { type: string, minLength: 1, maxLength: 250 }
        summary: { type: [string, "null"], maxLength: 10000 }
        slug:
          type: string
          maxLength: 250
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        featuredMediaId: { type: [integer, "null"], format: int64, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    CreateContentVersionInput:
      type: object
      additionalProperties: false
      required: [changeSummary]
      properties:
        changeSummary: { type: string, minLength: 1, maxLength: 2000 }
    EditorialSectionInput:
      type: object
      additionalProperties: false
      properties:
        typeCode: { type: string, minLength: 1, maxLength: 50, default: custom }
        title: { type: [string, "null"], maxLength: 150 }
        isCollapsible: { type: boolean, default: false }
        isVisible: { type: boolean, default: true }
        settings: { type: object, additionalProperties: true }
        blocks:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/EditorialBlockInput" }
    EditorialRelationsInput:
      type: object
      additionalProperties: false
      properties:
        categoryIds: { $ref: "#/components/schemas/EditorialIdList" }
        signalIds: { $ref: "#/components/schemas/EditorialIdList" }
        trendIds: { $ref: "#/components/schemas/EditorialIdList" }
        alertIds: { $ref: "#/components/schemas/EditorialIdList" }
    EditorialIdList:
      type: array
      maxItems: 100
      uniqueItems: true
      items: { type: integer, format: int64, minimum: 1 }
    EditorialCompositionInput:
      type: object
      additionalProperties: false
      required: [sections]
      properties:
        sections:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EditorialSectionInput" }
        relations: { $ref: "#/components/schemas/EditorialRelationsInput" }
        updatedAt: { type: string, format: date-time }
    ContentTransitionInput:
      type: object
      additionalProperties: false
      required: [transition]
      properties:
        transition:
          type: string
          enum: [SUBMIT_FOR_REVIEW, REQUEST_CHANGES, APPROVE, REOPEN, PUBLISH, ARCHIVE]
        notes: { type: [string, "null"], maxLength: 2000 }
    ContentHistoryEntry:
      type: object
      required: [id, toStatus, transition, changedBy, changedAt]
      properties:
        id: { type: integer, format: int64 }
        version:
          oneOf:
            - type: "null"
            - type: object
              required: [id, number]
              properties:
                id: { type: integer, format: int64 }
                number: { type: integer, minimum: 1 }
        fromStatus:
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/EditorialStatus" }]
        toStatus: { $ref: "#/components/schemas/EditorialStatus" }
        transition: { type: string }
        changedBy: { $ref: "#/components/schemas/EditorialPerson" }
        notes: { type: [string, "null"] }
        changedAt: { type: string, format: date-time }
    ContentTemplateSummary:
      type: object
      required: [id, name, type, sectionCount]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/EditorialStatus" }
        sectionCount: { type: integer, minimum: 0 }
    ContentTemplate:
      type: object
      required: [id, name, type, sections]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/EditorialStatus" }
        sections:
          type: array
          items: { type: object, additionalProperties: true }
    ContentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/InternalContent" }
    ContentVersionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ContentVersion" }
    ContentPreviewResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [id, type, status, version, preview]
              properties:
                id: { type: integer, format: int64 }
                slug: { type: [string, "null"] }
                type: { $ref: "#/components/schemas/EditorialStatus" }
                status: { $ref: "#/components/schemas/EditorialStatus" }
                version: { $ref: "#/components/schemas/ContentVersion" }
                preview: { type: boolean, const: true }
    PaginatedContentResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/InternalContent" }
            pagination: { $ref: "#/components/schemas/Pagination" }
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: [string, "null"] }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [success, message, code, errors]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        code: { type: string }
        errors:
          oneOf:
            - type: "null"
            - type: array
              items: { $ref: "#/components/schemas/ErrorDetail" }
  responses:
    AlertUpdated:
      description: Relaciones de la alerta actualizadas
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AlertResponse" }
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AuthenticationError:
      description: Autenticación requerida o inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PermissionError:
      description: Permiso insuficiente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFoundError:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ConflictError:
      description: Conflicto con el estado actual
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DomainRuleError:
      description: La operación incumple una regla de dominio
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
