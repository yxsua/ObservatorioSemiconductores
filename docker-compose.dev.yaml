services:

  nginx:
    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    # El archivo base construye la imagen productiva (Nginx). En desarrollo
    # necesitamos descartar ese `build` para no etiquetarla como node:22-alpine.
    build: !reset null
    image: node:22-alpine
    pull_policy: always
    volumes:
      - ./client:/app
      - /app/node_modules
    working_dir: /app
    # Cambiamos esto para asegurar que existan los módulos locales:
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: /api
      CHOKIDAR_USEPOLLING: "true"

  backend:

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: npm run dev

    ports:
      - "3001:3001"

  postgres:

    ports:
      - "5432:5432"
